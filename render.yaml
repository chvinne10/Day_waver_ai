services:
  - type: web
    name: dayweave-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SESSION_SECONDS
        value: "604800"
      - key: AI_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: FILE_STORAGE_ROOT
        value: /app/data/files
